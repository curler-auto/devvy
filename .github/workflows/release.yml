name: Release Build

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest]

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install backend dependencies
        run: |
          pip install -r ../backend/requirements.txt
          pip install pyinstaller

      - name: build backend sidecar
        shell: bash
        run: |
          # Debug: Check Rust info
          echo "Rust version info:"
          rustc -vV

          # Build using PyInstaller
          cd ../backend
          pyinstaller --clean desktop.spec

          # Debug: Check PyInstaller output
          echo "Backend dist contents:"
          ls -l dist/

          # Return to frontend to use relative paths for target dir
          cd ../frontend

          # Prepare binary destination
          mkdir -p src-tauri/binaries

          # Get Rust target triple
          rust_target=$(rustc -vV | sed -n 's/host: //p')
          echo "Detected Rust target: ${rust_target}"

          # Move and rename binary
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv ../backend/dist/devtools-desktop.exe src-tauri/binaries/devtools-desktop-${rust_target}.exe
          else
            mv ../backend/dist/devtools-desktop src-tauri/binaries/devtools-desktop-${rust_target}
            # Fix: Ensure binary is executable (Tauri requires this)
            chmod +x src-tauri/binaries/devtools-desktop-${rust_target}
          fi

          # Debug: Check final binaries
          echo "Final src-tauri/binaries contents:"
          ls -Rx src-tauri/binaries/

      - name: install frontend dependencies
        run: npm install --force  --legacy-peer-deps

      - name: Build React App
        run: npm run build
        env:
          CI: false

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
